[project]
name = "vault"
version = "0.1.0"
description = "A JSON-backed personal inventory API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# 本项目内覆盖全局镜像配置：本目录用官方 PyPI（不影响其它目录的清华源）
[tool.uv]
index-url = "https://pypi.org/simple"


